name: 'Docker Publish'
description: 'Build and push Clouseau Docker image to ghcr.io'
inputs:
  version:
    description: 'Clouseau version to build'
    required: true
  registry-token:
    description: 'GitHub token for registry authentication'
    required: true
  build-mode:
    description: 'Docker build mode (local or release)'
    required: false
    default: 'release'
  include-patch-tag:
    description: 'Whether to include the <major>.<minor>.<patch> image tag (set to false for rebuilds)'
    required: false
    default: 'true'
  full-version:
    description: 'Full Clouseau version (e.g. 3.4.1-SNAPSHOT) to set as CLOUSEAU_VERSION inside the image'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.registry-token }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/cloudant-labs/clouseau
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.include-patch-tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          type=semver,pattern={{major}},value=${{ inputs.version }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: docker/Dockerfile
        push: true
        no-cache: true
        build-args: |
          BUILD_MODE=${{ inputs.build-mode }}
          CLOUSEAU_VERSION=${{ inputs.full-version || inputs.version }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
