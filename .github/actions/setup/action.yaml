name: 'Setup Environment'
description: 'Setup common environment'
runs:
  using: 'composite'
  steps:
    - run: git config advice.detachedHead false
      shell: bash
    - name: Install mise & tools
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        install: true
        env: true
        cache: true
        export_path: true
