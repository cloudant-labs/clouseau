name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Prepare a Clouseau release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Set ENV for github-release
        run: |
          echo "RELEASE_TAG=${GITHUB_REF:10}" >> $GITHUB_ENV
          echo "RELEASE_NAME=$GITHUB_WORKFLOW" >> $GITHUB_ENV

      - name: Generate artifacts
        run: make artifacts

      - name: List artifacts
        run: ls artifacts

      - name: Create release
        run: make release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker-release:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Get version from version.sbt
        id: version
        run: |
          VERSION=$(make version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and publish
        uses: ./.github/actions/docker-publish
        with:
          version: ${{ steps.version.outputs.version }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  bump-snapshot:
    name: Bump to next snapshot version
    runs-on: ubuntu-latest
    needs: release
    # Only bump for regular releases, not release candidates
    if: |
      !contains(github.ref_name, '-RC') &&
      !contains(github.ref_name, '-rc')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bump version.sbt to next snapshot
        id: bump
        run: |
          git fetch origin main
          git branch -r --contains "${{ github.sha }}" | grep -q "origin/main" \
            || { echo "Tag is not on main, skipping bump."; exit 0; }
          git checkout origin/main -- version.sbt
          make bump-snapshot
          echo "NEXT_VSN=$(make version)" >> $GITHUB_ENV
          echo "bumped=true" >> $GITHUB_OUTPUT

      - name: Open PR with bumped version
        if: steps.bump.outputs.bumped == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Bump version to ${{ env.NEXT_VSN }}"
          branch: bump-snapshot-${{ github.ref_name }}
          title: "Bump version to ${{ env.NEXT_VSN }}"
          body: "Automated snapshot bump after release ${{ github.ref_name }}."
          base: main
