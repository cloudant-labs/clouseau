name: Build & Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint
        run: make ci-lint

      - name: Unit tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make test

      - name: Restart test
        run: make restart-test

      - name: RPC tests (zeunit)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make zeunit

      - name: Concurrent RPC tests (zeunit)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make concurrent-zeunit-tests

      - name: Syslog tests
        run: make syslog-tests

      - name: Elixir tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make ci-elixir

      - name: Metrics tests (mango)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: make metrics-tests

      - name: Clouseau Control tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: make clouseau-ctrl-smoke

  docker-integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Generate erlang.cookie
        run: make generate-erlang-cookie
      - name: Build Clouseau Docker image (local mode)
        run: make docker-build MODE=local
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
      - name: Run docker compose
        run: make docker-compose-up
      - name: Wait for CouchDB to be ready
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 2
          command: make docker-couchdb-is-ready
      - name: Test CouchDB and Clouseau integration
        run: make docker-test-integration
      - name: Mango tests on Docker
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make docker-mango-test
      - name: Elixir tests on Docker
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make docker-elixir-test
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose -f docker/compose.yaml logs --no-color || true

          echo "=== CouchDB Dev Logs ==="
          for log in deps/couchdb.*/dev/logs/*.log; do
            if [ -f "$log" ]; then
              echo "--- $log ---"
              cat "$log"
            fi
          done

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: docker-integration-logs
          path: |
            deps/couchdb.*/dev/logs/
            artifacts/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          make clean-erlang-cookie
