name: Build 3.x

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: git config advice.detachedHead false
      - name: Install mise & tools
        uses: jdx/mise-action@v4

      - name: Get default Java version
        run: java -version

      - name: Get Java home
        run: mise exec -- echo $JAVA_HOME

      - name: Get Java version
        uses: jdx/mise-action@v4
        run: java -version

      - name: Lint
        uses: jdx/mise-action@v4
        run: make ci-lint

      - name: Unit tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: mise exec -- make test

      - name: Restart test
        run: mise exec -- make restart-test
      - name: RPC tests (zeunit)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: mise exec -- make zeunit
      - name: Concurrent RPC tests (zeunit)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: mise exec -- make concurrent-zeunit-tests
      - name: Syslog tests
        run: mise exec -- make syslog-tests
      - name: Elixir tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: mise exec -- make ci-elixir
      - name: Metrics tests (mango)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: mise exec -- make metrics-tests
      - name: Clouseau Control tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: mise exec -- make clouseau-ctrl-smoke
