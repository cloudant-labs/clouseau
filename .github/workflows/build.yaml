name: Build & Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: git config advice.detachedHead false

      - name: Install mise & tools
        uses: jdx/mise-action@v4
        with:
          env: true
          cache: true
          export_path: true

      - name: Lint
        run: make ci-lint

      - name: Unit tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make test

      - name: Restart test
        run: make restart-test

      - name: RPC tests (zeunit)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make zeunit

      - name: Concurrent RPC tests (zeunit)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make concurrent-zeunit-tests

      - name: Syslog tests
        run: make syslog-tests

      - name: Elixir tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: make ci-elixir

      - name: Metrics tests (mango)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: make metrics-tests

      - name: Clouseau Control tests
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: make clouseau-ctrl-smoke
