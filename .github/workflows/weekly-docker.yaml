name: Weekly Build
on:
  schedule:
    - cron: '0 2 * * 0'  # 2 AM UTC every Sunday
  workflow_dispatch: # Allow manual trigger

jobs:
  weekly-build:
    name: Build and publish weekly Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        version: ['3.3.0']  # List of supported versions
        include:
          - version: '3.3.0'
            is_latest: true
      fail-fast: false  # Continue building other versions if one fails
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ matrix.version }}  # Checkout the specific version tag
      - uses: ./.github/actions/setup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get date for tagging
        id: date
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          no-cache: true  # Force fresh base image pull
          build-args: |
            BUILD_MODE=release
            CLOUSEAU_VERSION=${{ matrix.version }}
          tags: |
              ghcr.io/cloudant-labs/clouseau:${{ matrix.version }}
              ghcr.io/cloudant-labs/clouseau:${{ matrix.version }}-${{ steps.date.outputs.date }}
              ${{ matrix.is_latest && 'ghcr.io/cloudant-labs/clouseau:latest' || '' }}
          platforms: linux/amd64,linux/arm64
