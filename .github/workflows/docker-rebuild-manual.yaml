name: Docker Rebuild Manual

# Manually rebuilds and republishes the Docker image for a specific released
# version. Use this to fix a broken image without cutting a new release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to rebuild the image for (e.g. 3.4.0)'
        required: true

jobs:
  docker-release-patch:
    name: Rebuild and publish Docker image for a released version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          no-cache: true
          build-args: |
            BUILD_MODE=release
            CLOUSEAU_VERSION=${{ inputs.version }}
          tags: ghcr.io/cloudant-labs/clouseau:${{ inputs.version }}
          platforms: linux/amd64,linux/arm64
